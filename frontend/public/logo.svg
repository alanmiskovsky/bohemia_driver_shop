<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Path for top text -->
    <path id="topTextPath" d="M 100,100 m -70,0 a 70,70 0 1,1 140,0" fill="none"/>
    <!-- Path for bottom text -->
    <path id="bottomTextPath" d="M 100,100 m 70,0 a 70,70 0 1,1 -140,0" fill="none"/>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Triangular decorations around the edge -->
  <g fill="#1a1a1a">
    <!-- Generate triangles around the circle -->
    <polygon points="100,2 96,12 104,12" transform="rotate(0, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(15, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(30, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(45, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(60, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(75, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(90, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(105, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(120, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(135, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(150, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(165, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(180, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(195, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(210, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(225, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(240, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(255, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(270, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(285, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(300, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(315, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(330, 100, 100)"/>
    <polygon points="100,2 96,12 104,12" transform="rotate(345, 100, 100)"/>
  </g>

  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- White background for center -->
  <circle cx="100" cy="100" r="73" fill="white"/>

  <!-- Text ring background -->
  <circle cx="100" cy="100" r="73" fill="none" stroke="#1a1a1a" stroke-width="0"/>

  <!-- Curved text - BOHEMIA on top -->
  <text font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" letter-spacing="3">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">BOHEMIA DRIVER</textPath>
  </text>

  <!-- Curved text - DRIVER on bottom (reads correctly) -->
  <text font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" letter-spacing="3">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">BOHEMIA DRIVER</textPath>
  </text>

  <!-- Small dots/bullets between text sections -->
  <circle cx="30" cy="100" r="3" fill="#1a1a1a"/>
  <circle cx="170" cy="100" r="3" fill="#1a1a1a"/>

  <!-- Inner scene circle -->
  <clipPath id="sceneClip">
    <circle cx="100" cy="100" r="50"/>
  </clipPath>

  <g clip-path="url(#sceneClip)">
    <!-- Sky background -->
    <rect x="50" y="50" width="100" height="50" fill="white"/>

    <!-- Clouds -->
    <ellipse cx="70" cy="65" rx="12" ry="6" fill="#1a1a1a"/>
    <ellipse cx="85" cy="62" rx="10" ry="5" fill="#1a1a1a"/>
    <ellipse cx="115" cy="68" rx="14" ry="6" fill="#1a1a1a"/>
    <ellipse cx="130" cy="65" rx="10" ry="5" fill="#1a1a1a"/>

    <!-- Mountains - back layer -->
    <polygon points="50,110 75,75 100,110" fill="#1a1a1a"/>
    <polygon points="70,110 100,70 130,110" fill="#1a1a1a"/>
    <polygon points="100,110 125,78 150,110" fill="#1a1a1a"/>

    <!-- Mountains - front layer (slightly lighter or with detail) -->
    <polygon points="55,110 80,85 105,110" fill="#333"/>
    <polygon points="95,110 120,82 145,110" fill="#333"/>

    <!-- Ground/field area -->
    <rect x="50" y="108" width="100" height="45" fill="white"/>

    <!-- Road -->
    <polygon points="85,150 115,150 108,105 92,105" fill="#1a1a1a"/>

    <!-- Road center line markings -->
    <line x1="100" y1="110" x2="100" y2="118" stroke="white" stroke-width="2"/>
    <line x1="100" y1="123" x2="100" y2="131" stroke="white" stroke-width="2"/>
    <line x1="100" y1="136" x2="100" y2="144" stroke="white" stroke-width="2"/>

    <!-- Field lines (perspective lines on sides of road) -->
    <line x1="50" y1="150" x2="92" y2="105" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="60" y1="150" x2="94" y2="110" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="150" y1="150" x2="108" y2="105" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="140" y1="150" x2="106" y2="110" stroke="#1a1a1a" stroke-width="0.5"/>
  </g>

  <!-- Inner circle border for scene -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>