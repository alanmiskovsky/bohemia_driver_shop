version: '3.8'

services:
  # Nginx reverse proxy - serves React frontend and proxies to WordPress
  nginx:
    image: nginx:alpine
    container_name: bohemia-driver-shop-proxy
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - wordpress
    networks:
      - bohemia-network

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bohemia-driver-shop-frontend
    restart: unless-stopped
    networks:
      - bohemia-network

  # WordPress container (headless CMS)
  wordpress:
    image: wordpress:latest
    container_name: bohemia-driver-shop-wp
    restart: unless-stopped
    volumes:
      - ./wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-bohemia}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-bohemia_secure_pass_2024}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-bohemia_shop}
    networks:
      - bohemia-network

  # MySQL database container
  db:
    image: mysql:8.0
    container_name: bohemia-driver-shop-db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bohemia_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bohemia_shop}
      MYSQL_USER: ${MYSQL_USER:-bohemia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bohemia_secure_pass_2024}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-bohemia_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bohemia-network

networks:
  bohemia-network:
    driver: bridge
